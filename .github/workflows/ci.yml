name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, format and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
      - run: npm run typecheck
