name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same branch
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

  # Squash-merge the PR into main as soon as the checks pass, so nobody has to
  # click merge. Drafts are skipped: open a draft when the other founder should
  # look first, then mark it ready.
  merge:
    name: Merge when checks pass
    needs: checks
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --match-head-commit refuses to merge if new commits landed after this
      # run started, so only the exact code that passed gets merged
      - name: Squash-merge into main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
          --match-head-commit "$HEAD_SHA" --subject "$TITLE (#$PR)" --body ""
